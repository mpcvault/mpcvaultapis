syntax = "proto3";

package mpcvault.platform.v1;

import "google/protobuf/wrappers.proto";
import "google/api/annotations.proto";
import "mpcvault/platform/v1/error.proto";

option go_package = "go.mpcvault.com/genproto/mpcvaultapis/platform/v1;platform";
option java_multiple_files = true;
option java_outer_classname = "PlatformProto";
option java_package = "com.mpcvault.platform.v1";


service PlatformAPI {
    // CreateSigningRequest creates a signing request. The signing request can be completed using the MPCVault mobile app or using the API client signer.
    rpc CreateSigningRequest (CreateSigningRequestRequest) returns (CreateSigningRequestResponse){
        option (google.api.http) = {
            post: "/v1/createSigningRequest"
            body: "*"
        };
    };

    // RejectSigningRequest rejects a signing request. Once a signing request is rejected, it cannot be re-opened.
    rpc RejectSigningRequest (RejectSigningRequestRequest) returns (RejectSigningRequestResponse){
        option (google.api.http) = {
            post: "/v1/rejectSigningRequest"
            body: "*"
        };
    };

    // GetSigningRequestDetails returns the details of a signing request.
    // It will contain the signing request status and the transaction hash if the signing request was completed.
    rpc GetSigningRequestDetails (GetSigningRequestDetailsRequest) returns (GetSigningRequestDetailsResponse){
        option (google.api.http) = {
            post: "/v1/getSigningRequestDetails"
            body: "*"
        };
    };

    // CreateBatchPayment creates a batch payment. You will need to complete the batch payment using the MPCVault web app.
    rpc CreateBatchPayment (CreateBatchPaymentRequest) returns (CreateBatchPaymentResponse){
        option (google.api.http) = {
            post: "/v1/createBatchPayment"
            body: "*"
        };
    };

    // GetBatchPaymentDetails returns the details of a batch payment including the signing requests.
    rpc GetBatchPaymentDetails (GetBatchPaymentDetailsRequest) returns (GetBatchPaymentDetailsResponse){
        option (google.api.http) = {
            post: "/v1/getBatchPaymentDetails"
            body: "*"
        };
    };

    // CreateWallet creates a wallet. Wallets created will be EOA wallets. You are responsible for completing a sanity tests before using the wallet.
    // While the response contains the public key, you are strongly discouraged from using it to generate the wallet address yourself. Instead, use the address returned in the response.
    rpc CreateWallet (CreateWalletRequest) returns (CreateWalletResponse){
        option (google.api.http) = {
            post: "/v1/createWallet"
            body: "*"
        };
    };

    // ExecuteSigningRequests signs a signing request. The signing request can be created via the API or manually.
    rpc ExecuteSigningRequests (ExecuteSigningRequestsRequest) returns (ExecuteSigningRequestsResponse){
        option (google.api.http) = {
            post: "/v1/executeSigningRequests"
            body: "*"
        };
    };

    // GetBalance returns the details of a asset balance.
    rpc GetBalance (GetBalanceRequest) returns (GetBalanceResponse){
        option (google.api.http) = {
            post: "/v1/getBalance"
            body: "*"
        };
    };

    // GetWalletInfo returns the details of a wallet.
    rpc GetWalletInfo (GetWalletInfoRequest) returns (GetWalletInfoResponse){
        option (google.api.http) = {
            post: "/v1/getWalletInfo"
            body: "*"
        };
    };

    // GetWalletList returns the wallets details.
    rpc GetWalletList (GetWalletListRequest) returns (GetWalletListResponse){
        option (google.api.http) = {
            post: "/v1/getWalletList"
            body: "*"
        };
    };

    // GetSigningRequestList returns the signing requests details.
    // It will contain the signing request status and the transaction hash if the signing request was completed.
    rpc GetSigningRequestList (GetSigningRequestListRequest) returns (GetSigningRequestListResponse){
        option (google.api.http) = {
            post: "/v1/getSigningRequestList"
            body: "*"
        };
    };

    // Resimulation returns the transaction simulation.
    rpc Resimulation (ResimulationRequest) returns (ResimulationResponse){
        option (google.api.http) = {
            post: "/v1/resimulation"
            body: "*"
        };
    };
}

message GetWalletInfoRequest {
    oneof type {
        // Wallet address on the target network.
        string address = 100;
        // User-defined unique identifier for the wallet.
        string ref = 101;
    }
}

message GetWalletInfoResponse {
    Wallet details = 1;
    Error error = 2;
}

message GetWalletListRequest {
    // UUID of the vault that contains the wallets. Required.
    string vault_uuid = 1;
    // One-based page index for pagination. Default: 1.
    google.protobuf.Int64Value page = 2;
    // Maximum number of wallets to return per page. Default: 100. Maximum: 100.
    google.protobuf.Int64Value limit = 3;
}

message GetWalletListResponse {
    // List of wallet records for the vault.
    repeated Wallet details_list = 1;
    Error error = 2;
}

message GetBalanceRequest {
    // Network type (e.g. EVM, Solana). Required.
    NetworkType network_type = 1;
    // Chain ID of the network. Optional.
    google.protobuf.Int64Value chain_id = 2;
    // Wallet address to query. Required.
    string wallet_address = 3;
    // Token contract address. If omitted, returns the native token balance.
    google.protobuf.StringValue token_address = 4;
}

message GetBalanceResponse {
    // Balance in the smallest denomination (e.g. wei, lamports).
    string balance = 1;
    // Error details; null on success.
    Error error = 2;
}

message CreateWalletRequest {
    // UUID of the vault in which to create the wallet (see vault settings in the web app). Required.
    string vault_uuid = 1;
    // Public key of the API client signer; used to route callbacks. Optional.
    string callback_client_signer_public_key = 2;
    // Network type for the wallet (e.g. EVM, Solana). Required.
    NetworkType network_type = 3;
    // Customer-defined reference for the wallet. Must be unique when non-empty. Max length: 500.
    string ref = 4;
    // Display name for the wallet. Max length: 85.
    string name = 5;
}
enum NetworkType {
    NETWORK_TYPE_UNKNOWN = 0;
    NETWORK_TYPE_EVM = 1;
    NETWORK_TYPE_BITCOIN = 2;
    NETWORK_TYPE_TRON = 3;
    NETWORK_TYPE_APTOS = 4;
    NETWORK_TYPE_SUI = 5;
    NETWORK_TYPE_SOLANA = 6;
    NETWORK_TYPE_TON = 7;
}
enum KeyType {
    KEY_TYPE_UNSPECIFIED = 0;
    KEY_TYPE_ECC_SECP256K1 = 1;
    KEY_TYPE_ECC_ED25519 = 2;
}
message Wallet {
    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_PENDING = 1;
        STATUS_ACTIVE = 2;
        STATUS_ARCHIVED = 3;
    }
    // UUID of the vault that owns this wallet.
    string vault_uuid = 1;
    // Key type (e.g. ECC secp256k1, Ed25519).
    KeyType key_type = 2;
    // Key derivation path.
    string key_path = 3;
    // Public key bytes for the key.
    bytes public_key = 4;
    // Network type (e.g. EVM, Solana).
    NetworkType network_type = 5;
    // On-chain address for this wallet on the network.
    string address = 6;
    // User-defined unique identifier for the wallet.
    string ref = 7;
    // Current wallet status (e.g. pending, active, archived).
    Status status = 8;
    // Display name of the wallet.
    string name = 9;
}
message CreateWalletResponse {
    Wallet details = 1;
    Error error = 2;
}

message ExecuteSigningRequestsRequest {
    // UUID of the signing request. Only API wallet signing requests are supported. Required.
    string uuid = 1;
}
message ExecuteSigningRequestsResponse {
    Error error = 1;
    // Hash of the signed transaction; populated when status is STATUS_SUCCEEDED. Indicates the request was signed, not that the on-chain transaction succeeded.
    string tx_hash = 2;
    // Signatures of the raw message; populated when status is STATUS_SUCCEEDED.
    SignatureContainer signatures = 3;
    // Signed transaction payload ready for broadcast; populated when status is STATUS_SUCCEEDED.
    string signed_transaction = 4;
}

message SignatureContainer {
    message SignResponse {
        oneof signature {
            ECDSASignature ecdsa_signature = 1;
            // Ed25519 signature of the raw message; set when status is STATUS_SUCCEEDED. Format: 64 bytes, sig = R_bytes || s_bytes (RFC 8032 §5.1.2).
            bytes eddsa_signature = 2;
        }
    }
    message ECDSASignature {
        string R = 1;
        string S = 2;
        string V = 3;
    }
    repeated SignResponse signatures = 1;
}

message EVMMessage {
    enum Type {
        TYPE_UNSPECIFIED = 0;
        TYPE_PERSONAL_SIGN = 1;
        TYPE_SIGN_TYPED_DATA = 2;
    }
    // Chain ID of the target network.
    uint64 chain_id = 1;
    // Sender address; must belong to a wallet in this vault.
    string from = 2;
    // Message type (e.g. personal sign, typed data). Required.
    Type type = 3;
    // Raw message payload in bytes.
    bytes content = 4;
}

message AptosMessage {
    enum Type {
        TYPE_UNSPECIFIED = 0;
        TYPE_DEFAULT = 1;
    }
    message Message {
        // Sender address; must belong to a wallet in this vault.
        google.protobuf.StringValue address = 1;
        // Application identifier for the message.
        google.protobuf.StringValue application = 2;
        // Chain ID of the network.
        google.protobuf.Int64Value chain_id = 3;
        // Message payload or description.
        string message = 4;
        // Nonce for the message.
        string nonce = 5;
    }
    // Sender wallet address; must belong to this vault.
    string from = 1;
    // Message type. Required.
    Type type = 2;
    Message content = 3;
}

message SolanaMessage {
    enum Type {
        TYPE_UNSPECIFIED = 0;
        TYPE_DEFAULT = 1;
    }
    // Sender wallet address; must belong to this vault.
    string from = 1;
    // Message type. Required.
    Type type = 2;
    // Raw message content in bytes.
    bytes content = 3;
}

message SuiMessage {
    enum Type {
        TYPE_UNSPECIFIED = 0;
        TYPE_DEFAULT = 1;
    }
    // Sender wallet address; must belong to this vault.
    string from = 1;
    // Message type. Required.
    Type type = 2;
    // Raw message content in bytes.
    bytes content = 3;
}

message TonMessage {
    enum Type {
        TYPE_UNSPECIFIED = 0;
        TYPE_DEFAULT = 1;
    }
    // Sender wallet address; must belong to this vault.
    string from = 1;
    // Message type. Required.
    Type type = 2;
    // Raw message content in bytes.
    bytes content = 3;
}

message RawMessage {
    // Wallet address of the key pair used to sign; must be in this vault. The key's algorithm is used for signing.
    string from = 1;
    // Raw message payload in bytes.
    bytes content = 2;
    // Hash function for ECDSA signing. Required when the key is ECDSA; ignored for non-ECDSA keys.
    ECDSAHashFunction ecdsa_hash_function = 3;
}

enum ECDSAHashFunction {
    ECDSA_HASH_FUNCTION_UNSPECIFIED = 0;
    ECDSA_HASH_FUNCTION_USE_MESSAGE_DIRECTLY = 1;
    ECDSA_HASH_FUNCTION_SHA256 = 2;
}

// EVMGas defines gas fee parameters for an EVM transaction.
message EVMGas {
    // Maximum fee per gas (wei). Optional.
    google.protobuf.StringValue max_fee = 1;
    // Maximum priority fee for EIP-1559 (wei). Omit to disable EIP-1559.
    google.protobuf.StringValue max_priority_fee = 2;
    // Maximum gas units the transaction may consume.
    google.protobuf.StringValue gas_limit = 3;
}

message EVMSendNative {
    // Chain ID of the target network.
    uint64 chain_id = 1;
    // Sender wallet address; must belong to this vault.
    string from = 2;
    // Recipient address.
    string to = 3;
    // Amount of native token to send, in wei.
    string value = 4;
    // Gas fee settings. Required for custom chains.
    EVMGas gas_fee = 5;
    // Transaction nonce. If unset, the next available nonce is used. Required for custom chains.
    google.protobuf.Int64Value nonce = 6;
}

message EVMSendERC20 {
    // Chain ID of the target network.
    uint64 chain_id = 1;
    // Sender wallet address; must belong to this vault.
    string from = 2;
    // Recipient address.
    string to = 3;
    // ERC20 token contract address.
    string token_contract_address = 4;
    // Token amount in smallest units (amount × 10^decimals); contract decimals are used for conversion.
    string amount = 5;
    // Gas fee settings. Required for custom chains.
    EVMGas gas_fee = 6;
    // Transaction nonce. If unset, the next available nonce is used. Required for custom chains.
    google.protobuf.Int64Value nonce = 7;
}

message EVMSendCustom {
    // Chain ID of the target network.
    uint64 chain_id = 1;
    // Sender wallet address; must belong to this vault.
    string from = 2;
    // Recipient address.
    string to = 3;
    // Native token amount in wei.
    string value = 4;
    // Calldata or input payload for the transaction.
    bytes input = 5;
    // Gas fee settings. Required for custom chains.
    EVMGas gas_fee = 6;
    // Transaction nonce. If unset, the next available nonce is used. Required for custom chains.
    google.protobuf.Int64Value nonce = 7;
}

message BTCSendNative {
    // Sender wallet address; must belong to this vault.
    string from = 1;
    // Recipient address.
    string to = 2;
    // Amount to send in satoshi.
    string amount = 3;
    // Network fee rate in sat/vB.
    uint64 network_fee = 4;
}

message TronSendNative {
    // Sender wallet address; must belong to this vault.
    string from = 1;
    // Recipient address.
    string to = 2;
    // Amount of native TRX to send, in sun.
    string value = 3;
}

message TronSendTRC10 {
    // Sender wallet address; must belong to this vault.
    string from = 1;
    // Recipient address.
    string to = 2;
    // TRC10 asset name or identifier.
    string asset_name = 3;
    // Token amount in smallest units (amount × 10^decimals).
    string amount = 4;
}

message TronSendTRC20 {
    // Sender wallet address; must belong to this vault.
    string from = 1;
    // Recipient address.
    string to = 2;
    // TRC20 token contract address.
    string contract_address = 3;
    // Token amount in smallest units (amount × 10^decimals).
    string amount = 4;
    // Maximum fee in sun. Optional.
    google.protobuf.StringValue fee_limit = 5;
}

message AptosGas {
    // Maximum gas units for the transaction. See https://aptos.dev/concepts/gas-txn-fee/#unit-of-gas
    google.protobuf.StringValue max_gas_amount = 1;
    // Gas unit price in octas.
    google.protobuf.StringValue gas_unit_price = 2;
}

message AptosSendNative {
    // Chain ID: 1 for Aptos Mainnet, 126 for Movement Mainnet. Testnets are not supported.
    uint64 chain_id = 1;
    // Sender wallet address; must belong to this vault.
    string from = 2;
    // Recipient address.
    string to = 3;
    // Amount of native token in octas.
    string value = 4;
    // Gas fee parameters for the transaction.
    AptosGas gas_fee = 5;
}

message AptosSendCoin {
    // Chain ID: 1 for Aptos Mainnet, 126 for Movement Mainnet. Testnets are not supported.
    uint64 chain_id = 1;
    // Sender wallet address; must belong to this vault.
    string from = 2;
    // Recipient address.
    string to = 3;
    // Coin identifier (e.g. tx_hash and output_index).
    string coin_tag = 4;
    // Token amount in smallest units (amount × 10^decimals).
    string amount = 5;
    // Gas fee parameters for the transaction.
    AptosGas gas_fee = 6;
}

message AptosSendCustom {
    // Chain ID: 1 for Aptos Mainnet, 126 for Movement Mainnet. Testnets are not supported.
    uint64 chain_id = 1;
    // Sender wallet address; must belong to this vault.
    string from = 2;
    // Transaction payload: JSON or BCS-serialized bytes.
    bytes payload = 3;
    // Gas fee parameters for the transaction.
    AptosGas gas_fee = 4;
}

message SuiGas {
    // Maximum gas budget in mist.
    google.protobuf.StringValue budget = 1;
    // Gas price in mist.
    google.protobuf.StringValue price = 2;
}

message SuiSendNative {
    // Sender wallet address; must belong to this vault.
    string from = 1;
    // Recipient address.
    string to = 2;
    // Amount of native SUI in mist.
    string value = 3;
    // Gas fee parameters for the transaction.
    SuiGas gas_fee = 4;
}

message SuiSendCoin {
    // Sender wallet address; must belong to this vault. Required.
    string from = 1;
    // Recipient address. Required.
    string to = 2;
    // Coin identifier (e.g. tx_hash and output_index). Required.
    string coin_tag = 3;
    // Amount in smallest units (amount × 10^decimals). Required.
    string amount = 4;
    // Gas fee parameters for the transaction.
    SuiGas gas_fee = 5;
}

message SuiSendCustom {
    // Sender wallet address; must belong to this vault. Required.
    string from = 1;
    // Transaction payload: JSON or BCS-serialized bytes. Required.
    bytes payload = 2;
}

message SolanaSendNative {
    // Sender wallet address; must belong to this vault. Required.
    string from = 1;
    // Recipient account address. Required.
    string to = 2;
    // Amount of native SOL in lamports. Required.
    string value = 3;
    // Chain ID: 101 for Solana Mainnet, 0 for Sonic SVM Mainnet. Testnets not supported.
    uint64 chain_id = 4;
}

message SolanaSendSPLToken {
    // Sender wallet address; must belong to this vault. Required.
    string from = 1;
    // Recipient account address. Required.
    string to = 2;
    // SPL token mint address. Required.
    string mint_address = 3;
    // Token amount in smallest units (amount × 10^decimals). Required.
    string amount = 4;
    // Chain ID: 101 for Solana Mainnet, 0 for Sonic SVM Mainnet. Testnets not supported.
    uint64 chain_id = 5;
    // Token decimals. Optional.
    google.protobuf.Int64Value decimals = 6;
}

message TonSendNative {
    // Sender wallet address; must belong to this vault. Required.
    string from = 1;
    // Recipient address. Required.
    string to = 2;
    // Amount of native TON in nanos. Required.
    string value = 3;
    // Optional comment. Maximum length: 50.
    string comment = 4;
}

message TonSendToken {
    // Sender wallet address; must belong to this vault. Required.
    string from = 1;
    // Recipient address. Required.
    string to = 2;
    // Token mint address. Required.
    string mint_address = 3;
    // Token amount in smallest units (amount × 10^decimals). Required.
    string amount = 4;
    // Comment. Maximum length: 50. Required.
    string comment = 5;
    // Token decimals. Optional.
    google.protobuf.Int64Value decimals = 6;
}

message TonSendCustom {
    // Sender wallet address; must belong to this vault. Required.
    string from = 1;
    // Transaction payload in JSON format (compatible with TON Connect). Required.
    bytes payload = 2;
}

message SolanaSendCustom {
    // Sender wallet address; must belong to this vault. Required.
    string from = 1;
    // Base64-encoded transaction(s). Required.
    repeated string tx_base64 = 2;
    // Chain ID: 101 for Solana Mainnet, 0 for Sonic SVM Mainnet. Testnets not supported.
    uint64 chain_id = 3;
}

message CreateSigningRequestRequest {
    // Signing request payload; exactly one of the listed types must be set.
    oneof type {
        EVMSendNative evm_send_native = 1;
        EVMSendERC20 evm_send_erc20 = 2;
        EVMSendCustom evm_send_custom = 3;
        BTCSendNative btc_send_native = 4;
        TronSendNative tron_send_native = 5;
        TronSendTRC10 tron_send_trc10 = 6;
        TronSendTRC20 tron_send_trc20 = 7;
        AptosSendNative aptos_send_native = 8;
        AptosSendCoin aptos_send_coin = 9;
        AptosSendCustom aptos_send_custom = 10;
        SuiSendNative sui_send_native = 11;
        SuiSendCoin sui_send_coin = 12;
        SuiSendCustom sui_send_custom = 13;
        SolanaSendNative solana_send_native = 14;
        SolanaSendSPLToken solana_send_spl_token = 15;
        EVMMessage evm_message = 16;
        AptosMessage aptos_message = 17;
        SolanaMessage solana_message = 18;
        RawMessage raw_message = 19;
        SuiMessage sui_message = 20;
        TonSendNative ton_send_native = 21;
        TonSendToken ton_send_token = 22;
        TonSendCustom ton_send_custom = 23;
        TonMessage ton_message = 24;
        SolanaSendCustom solana_send_custom = 25;
        SolanaSendNative sonic_svm_send_native = 26;
        SolanaSendSPLToken sonic_svm_send_spl_token = 27;
        SolanaSendCustom sonic_svm_send_custom = 28;
    }
    // Optional notes for the signing request.
    google.protobuf.StringValue notes = 1000;
    // UUID of the vault in which to create the signing request. Required.
    google.protobuf.StringValue vault_uuid = 1001;
    // Public key of the API client signer for callback delivery. If empty, the request is shown in the MPCVault app for manual signing. Required for API wallets (they can only be signed by the API client signer).
    google.protobuf.StringValue callback_client_signer_public_key = 1002;
}

message CreateSigningRequestResponse {
    // The created signing request.
    SigningRequest signing_request = 1;
    Error error = 2;
}

message RejectSigningRequestRequest {
    // Unique identifier of the signing request to reject. Required.
    string uuid = 1;
}

message RejectSigningRequestResponse {
    Error error = 1;
}

message GetSigningRequestDetailsRequest {
    // Unique identifier of the signing request. Required.
    string uuid = 1;
}

message GetSigningRequestDetailsResponse {
    SigningRequest signing_request = 1;
    Error error = 2;
}

message SigningRequest {
    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_PENDING = 1;
        STATUS_SUCCEEDED = 2;
        STATUS_FAILED = 3;
    }
    // Unique identifier of the signing request.
    string uuid = 1;
    // Current status. STATUS_SUCCEEDED indicates the request was signed, not that the on-chain transaction succeeded.
    Status status = 2;
    // Failure reason; populated only when status is STATUS_FAILED.
    string failed_reason = 3;
    // Transaction hash; populated when status is STATUS_SUCCEEDED. Indicates the request was signed, not on-chain success.
    string tx_hash = 4;
    // Unix timestamp (ms) when the signing request was created.
    uint64 creation_timestamp = 5;
    // Signing request payload; exactly one of the listed types is set.
    oneof type {
        EVMSendNative evm_send_native = 6;
        EVMSendERC20 evm_send_erc20 = 7;
        EVMSendCustom evm_send_custom = 8;
        BTCSendNative btc_send_native = 9;
        TronSendNative tron_send_native = 10;
        TronSendTRC10 tron_send_trc10 = 11;
        TronSendTRC20 tron_send_trc20 = 12;
        AptosSendNative aptos_send_native = 13;
        AptosSendCoin aptos_send_coin = 14;
        AptosSendCustom aptos_send_custom = 15;
        SuiSendNative sui_send_native = 16;
        SuiSendCoin sui_send_coin = 17;
        SuiSendCustom sui_send_custom = 18;
        SolanaSendNative solana_send_native = 19;
        SolanaSendSPLToken solana_send_spl_token = 20;
        CreateWalletRequest create_wallet = 21;
        EVMMessage evm_message = 22;
        AptosMessage aptos_message = 23;
        SolanaMessage solana_message = 24;
        RawMessage raw_message = 25;
        SuiMessage sui_message = 26;
        TonSendNative ton_send_native = 27;
        TonSendToken ton_send_token = 28;
        TonSendCustom ton_send_custom = 29;
        TonMessage ton_message = 30;
        SolanaSendCustom solana_send_custom = 31;
        SolanaSendNative sonic_svm_send_native = 32;
        SolanaSendSPLToken sonic_svm_send_spl_token = 33;
        SolanaSendCustom sonic_svm_send_custom = 34;
    }
    // Transaction notes for the signing request.
    google.protobuf.StringValue notes = 999;
    // UUID of the vault that owns this signing request.
    google.protobuf.StringValue vault_uuid = 1000;
    // Public key of the API client signer used for callbacks. May be empty.
    google.protobuf.StringValue callback_client_signer_public_key = 1001;
    // Transaction simulation data for the signing request.
    bytes simulation = 1002;
    // Decoded EVM transaction input data, when applicable.
    EVMInputDataDecode evm_input_data_decode = 1003;
}

message EVMInputDataDecode {
    message Argument {
        string name = 1;
        string type = 2;
        string data = 3;
    }
    // Decoded function selector and signature (e.g. function_name(arg1_type, arg2_type)).
    string function = 1;
    // Decoded list of function arguments (name, type, data).
    repeated Argument args = 2;
}

message BatchPaymentRecipient {
    // Recipient address. Required.
    string address = 1;
    // Amount to send. Native tokens: wei (EVM) or satoshi (BTC). ERC20: smallest units (amount × 10^decimals). Required.
    string amount = 2;
    // Optional note for this recipient.
    google.protobuf.StringValue notes = 3;
}

message EVMBatchSendNative {
    // Chain ID for the transaction. Required.
    uint64 chain_id = 1;
    // Sender wallet address; must belong to this vault. Required.
    string from = 2;
    // List of recipients and amounts. Required.
    repeated BatchPaymentRecipient recipients = 3;
}

message EVMBatchSendERC20 {
    // Chain ID for the transaction. Required.
    uint64 chain_id = 1;
    // Sender wallet address; must belong to this vault. Required.
    string from = 2;
    // ERC20 token contract address. Required.
    string token_contract_address = 3;
    // List of recipients and amounts.
    repeated BatchPaymentRecipient recipients = 4;
}

message BTCBatchSendNative {
    // Sender wallet address; must belong to this vault. Required.
    string from = 1;
    // List of recipients and amounts.
    repeated BatchPaymentRecipient recipients = 2;
}

message SUIBatchSendNative {
    // Sender wallet address; must belong to this vault. Required.
    string from = 1;
    // List of recipients and amounts.
    repeated BatchPaymentRecipient recipients = 2;
}

message SUIBatchSendCoin {
    // Sender wallet address; must belong to this vault. Required.
    string from = 1;
    // Coin identifier (e.g. tx_hash and output_index). Required.
    string coin_tag = 2;
    // List of recipients and amounts.
    repeated BatchPaymentRecipient recipients = 3;
}

message CreateBatchPaymentRequest {
    // Display name for the batch payment.
    string name = 1;
    // Optional notes for the batch payment.
    google.protobuf.StringValue notes = 2;
    // Batch payment payload; exactly one of the listed types must be set.
    oneof type {
        EVMBatchSendNative evm_batch_send_native = 3;
        EVMBatchSendERC20 evm_batch_send_erc20 = 4;
        BTCBatchSendNative btc_batch_send_native = 5;
        SUIBatchSendNative sui_batch_send_native = 6;
        SUIBatchSendCoin sui_batch_send_coin = 7;
    }
}

message CreateBatchPaymentResponse {
    BatchPayment batch_payment = 1;
    Error error = 2;
}

message GetBatchPaymentDetailsRequest {
    // Unique identifier of the batch payment. Required.
    string uuid = 1;
}

message GetBatchPaymentDetailsResponse {
    BatchPayment batch_payment = 1;
    Error error = 2;
}

message BatchPayment {
    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_PENDING = 1;
        STATUS_SUCCEEDED = 2;
        STATUS_FAILED = 3;
    }
    // Unique identifier of the batch payment.
    string uuid = 1;
    // Display name of the batch payment.
    string name = 2;
    // Transaction notes for the batch payment.
    string notes = 3;
    // Current status of the batch payment.
    Status status = 4;
    // Failure reason; populated only when status is STATUS_FAILED.
    string failed_reason = 5;
    // Unix timestamp (ms) when the batch payment was created.
    uint64 creation_timestamp = 6;
    // Signing request that approves token spend, when required.
    SigningRequest approval_signing_request = 7;
    // Signing request that executes the batch send.
    SigningRequest send_signing_request = 8;
    // Batch payment payload; exactly one of the listed types is set.
    oneof type {
        EVMBatchSendNative evm_batch_send_native = 9;
        EVMBatchSendERC20 evm_batch_send_erc20 = 10;
        BTCBatchSendNative btc_batch_send_native = 11;
        SUIBatchSendNative sui_batch_send_native = 12;
        SUIBatchSendCoin sui_batch_send_coin = 13;
    }
}

message GetSigningRequestListRequest {
    enum SortOrder {
        SORT_ORDER_DESC = 0;
        SORT_ORDER_ASC = 1;
    }
    // UUID of the vault whose signing requests to list. Required.
    string vault_uuid = 1;
    // One-based page index. Default: 1.
    google.protobuf.Int64Value page = 2;
    // Maximum number of signing requests per page. Default: 10. Maximum: 100.
    google.protobuf.Int64Value limit = 3;
    // Sort order: 0 = descending, 1 = ascending. Required.
    SortOrder sort_order = 4;
}

message GetSigningRequestListResponse {
    repeated SigningRequest signing_requests = 1;
    Error error = 2;
}

message ResimulationRequest {
    // UUID of the signing request to simulate. Required.
    string signing_request_uuid = 1;
}

message ResimulationResponse {
    // Simulation result for the signing request.
    bytes simulation = 1;
    Error error = 2;
}
