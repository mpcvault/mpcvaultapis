    repeated SigningApproval approved_members = 1011;
    //comment:pending_operation is the current action for the authenticated API user and actual ClientSigner binding.
    // Returned by GetSigningRequestDetails, GetSigningRequestList and GetPendingSigningRequests only.
    // Unset for terminal requests or when no action applies; evaluation failures return an error.
    // See SigningRequestOperation for approval/signing stages. Execution revalidates permissions and policy.
    SigningRequestOperation pending_operation = 1012;
}

//comment:SigningApproval is one recorded approval on a signing request.
message SigningApproval {
    //symbol_value:"<string>"
    //comment:user_uuid is the user who approved.
    string user_uuid = 1;
    //symbol_value:1744274467154
    //comment:timestamp is when the approval was recorded, in Unix milliseconds.
    uint64 timestamp = 2;
}

//comment:DAppRequest preserves a dApp transaction or message without a chain-specific payload.
// The claimed website is on SigningRequest.source.website.
message DAppRequest {
    //symbol_value:"SIGN_TRANSACTION"
    //comment:request_type is the stored dApp request type.
    string request_type = 1;
    //symbol_value:"<string>"
    //comment:from is the stored from address.
    string from = 3;
    //symbol_value:"<string>"
    //comment:to is the stored to address.
    string to = 4;
    //symbol_value:"1"
    //comment:amount is the stored amount text, when present. Its unit and meaning depend on the request type and
    // network.
    string amount = 5;
    //comment:data is the stored call data or message text in the original request format.
    string data = 6;
    //comment:network identifies the blockchain network of the original dApp transaction or message using its protocol
    // and native network identifier.
    NetworkInfo network = 7;
}

//comment:ChainTransaction is the chain body of a request that also carries MPCVault fields. The member that is set uses
// the same message as a plain send of that chain.
message ChainTransaction {
    oneof body {
        //comment:evm_send_native uses the same fields as EVMSendNative.
        EVMSendNative evm_send_native = 1;
        //comment:evm_send_erc20 uses the same fields as EVMSendERC20.
        EVMSendERC20 evm_send_erc20 = 2;
        //comment:evm_send_custom uses the same fields as EVMSendCustom.
        EVMSendCustom evm_send_custom = 3;
        //comment:solana_send_native uses the same fields as SolanaSendNative.
        SolanaSendNative solana_send_native = 4;
        //comment:solana_send_spl_token uses the same fields as SolanaSendSPLToken.
        SolanaSendSPLToken solana_send_spl_token = 5;
        //comment:solana_send_custom uses the same fields as SolanaSendCustom.
        SolanaSendCustom solana_send_custom = 6;
        //comment:sui_send_native uses the same fields as SuiSendNative.
        SuiSendNative sui_send_native = 7;
        //comment:sui_send_coin uses the same fields as SuiSendCoin.
        SuiSendCoin sui_send_coin = 8;
        //comment:sui_send_custom uses the same fields as SuiSendCustom.
        SuiSendCustom sui_send_custom = 9;
    }
}

//comment:NetworkInfo identifies a blockchain network by its protocol and native network identifier. The selected body
// identifies the protocol family.
message NetworkInfo {
    oneof body {
        EVMNetwork evm = 1;
        BitcoinNetwork bitcoin = 2;
        TronNetwork tron = 3;
        AptosNetwork aptos = 4;
        SuiNetwork sui = 5;
        SolanaNetwork solana = 6;
        TonNetwork ton = 7;
        StellarNetwork stellar = 8;
    }
}

message EVMNetwork {
    //symbol_value:1
    //comment:chain_id is the native EIP-155 chain ID. For example, 1 identifies Ethereum Mainnet and 8453 identifies
    // Base Mainnet.
    uint64 chain_id = 1;
}

message BitcoinNetwork {
    //comment:genesis_hash is the full genesis block hash as 64 lowercase hexadecimal characters without a 0x prefix,
    // using the same byte order as Bitcoin RPC block hash strings. It distinguishes networks such as Mainnet and
    // Testnet3.
    string genesis_hash = 1;
}

message TronNetwork {
    //symbol_value:728126428
    //comment:chain_id is TRON's native unsigned 32-bit chain ID, derived from the last four bytes of the genesis block
    // hash. 728126428 identifies Mainnet.
    uint32 chain_id = 1;
}

message AptosNetwork {
    //symbol_value:1
    //comment:chain_id is the native numeric chain ID returned by the ledger API. Use 1 for Aptos Mainnet and 126 for
    // Movement Mainnet. Movement uses this protocol body.
    uint64 chain_id = 1;
}

message SuiNetwork {
    //symbol_value:"35834a8a"
    //comment:chain_identifier is Sui's native chain identifier: the first four bytes of the genesis checkpoint digest,
    // encoded as eight lowercase hexadecimal characters without a 0x prefix. 35834a8a identifies Mainnet.
    string chain_identifier = 1;
}

message SolanaNetwork {
    //symbol_value:"5eykt4UsFv8P8NJdTREpY1vzqKqZKvdpKuc147dw2N9d"
    //comment:genesis_hash is the full, case-sensitive Base58 genesis hash returned by getGenesisHash. Sonic SVM uses
    // this protocol body with its own genesis hash.
    string genesis_hash = 1;
}

message TonNetwork {
    //symbol_value:-239
    //comment:global_id is the signed native network global_id. -239 identifies TON Mainnet; preserve its sign.
    int32 global_id = 1;
}

message StellarNetwork {
    //symbol_value:"Public Global Stellar Network ; September 2015"
    //comment:network_passphrase is the public network passphrase used to compute the Stellar network ID. Preserve the
    // exact text, including case, spaces and punctuation.
    string network_passphrase = 1;
}

//comment:SwapQuoteAsset is the asset, account and amount on one side of a swap quote.
message SwapQuoteAsset {
    //comment:network identifies the blockchain network of this side of the quote using its protocol and native network
    // identifier.
    NetworkInfo network = 1;
    //symbol_value:"<string>"
    //comment:account_address is the source account on the from side or the recipient account on the to side of the
    // quote.
    string account_address = 2;
    //symbol_value:"0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
    //comment:asset_identifier identifies the asset on network: an EVM token contract address, a Solana mint address, or
    // a Sui coin type. Empty for the native asset.
    string asset_identifier = 3;
    //symbol_value:"1"
    //comment:amount is the amount text stored on the quote. It is not scaled by token decimals.
    string amount = 4;
}

message SwapRoute {
    //symbol_value:"route"
    //comment:name is the route name stored on the quote.
    string name = 1;
    //symbol_value:"1.9"
    //comment:min_receive_amount is the minimum receive amount as a decimal in whole units of SwapQuote.to's asset.
    // SwapQuote.to.amount is the expected amount before slippage tolerance.
    string min_receive_amount = 3;
    //symbol_value:"0.00021"
    //comment:gas_cost is the stored decimal fee estimate in whole units of SwapQuote.from.network's native asset,
    // not a gas-unit count. Empty means unavailable.
    string gas_cost = 4;
    //symbol_value:"0.42"
    //comment:gas_cost_usd is the US dollar figure stored on the quote. It is not a price looked up when the signing
    // request is read.
    string gas_cost_usd = 5;
}

//comment:SwapQuote is the quote stored next to a swap. It is not part of the chain transaction.
message SwapQuote {
    //comment:from is the asset sold, with its source account and amount from the stored quote.
    SwapQuoteAsset from = 1;
    //comment:to is the asset bought, with its recipient account and amount from the stored quote.
    SwapQuoteAsset to = 2;
    //comment:route is the route stored on the quote.
    SwapRoute route = 3;
    //symbol_value:"0.005"
    //comment:slippage is the stored quote tolerance as a decimal ratio: "0.005" means 0.5%.
    // It is neither the original custom input nor realized execution slippage. Empty means unavailable.
    string slippage = 4;
}

//comment:EVMERC20Approval is an ERC20 allowance transaction on an EVM network, independent of the business requesting
// it.
message EVMERC20Approval {
    //symbol_value:1
    //comment:chain_id is the chain id of the network.
    uint64 chain_id = 1;
    //symbol_value:"<string>"
    //comment:from is the account granting the allowance.
    string from = 2;
    //symbol_value:"0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
    //comment:token_contract_address is the token contract being approved.
    string token_contract_address = 3;
    //symbol_value:"0x1111111254EEB25477B68fb85Ed929f73A960582"
    //comment:spender is the address being approved to spend the token.
    string spender = 4;
    //symbol_value:"1000"
    //comment:amount is the allowance in the token's smallest unit. The stored amount is multiplied by 10^decimals, the
    // same scaling as EVMSendERC20.amount.
    string amount = 5;
    //comment:gas_fee uses the same fields as EVMGas.
    EVMGas gas_fee = 6;
    //symbol_value:1
    //comment:nonce is the nonce of the approval. Empty or non-numeric stored nonces are omitted.
    google.protobuf.Int64Value nonce = 7;
}

//comment:FungibleAssetApproval grants, updates or revokes permission to spend a holder's fungible asset.
// The body identifies the chain and approval standard; currently only EVM ERC20 is supported.
message FungibleAssetApproval {
    oneof body {
        //comment:evm_erc20_approval is an ERC20 allowance transaction on an EVM network.
        EVMERC20Approval evm_erc20_approval = 1;
    }
}

//comment:SwapApproval is a spending authorization for a fungible asset requested before a swap, with its quote context.
message SwapApproval {
    //comment:approval is the chain-specific spending authorization transaction for a fungible asset.
    FungibleAssetApproval approval = 1;
    //comment:swap_quote is the quote stored with the approval. It is not part of the allowance transaction. If the
    // stored JSON cannot be parsed, this is left unset and the read still succeeds.
    SwapQuote swap_quote = 2;
}

//comment:SwapSend is the swap transaction itself.
message SwapSend {
    //comment:transaction is the chain body. The member that is set uses the same message as a plain send of that chain.
    ChainTransaction transaction = 1;
    //comment:swap_quote is the quote stored with the swap. It is not part of the chain transaction. If the stored JSON
    // cannot be parsed, this is left unset and the read still succeeds.
    SwapQuote swap_quote = 2;
}

//comment:BatchPaymentBody describes the sender, asset and recipients, as approval context or the payment body.
// BatchPaymentSend carries gas_limit and nonce separately.
message BatchPaymentBody {
    oneof transaction {
        //comment:evm_send_native uses the same fields as EVMBatchSendNative.
        EVMBatchSendNative evm_send_native = 1;
        //comment:evm_send_erc20 uses the same fields as EVMBatchSendERC20.
        EVMBatchSendERC20 evm_send_erc20 = 2;
        //comment:btc_send_native uses the same fields as BTCBatchSendNative.
        BTCBatchSendNative btc_send_native = 3;
        //comment:sui_send_native uses the same fields as SUIBatchSendNative.
        SUIBatchSendNative sui_send_native = 4;
        //comment:sui_send_coin uses the same fields as SUIBatchSendCoin.
        SUIBatchSendCoin sui_send_coin = 5;
    }
}

//comment:BatchPaymentApproval is a spending authorization for a fungible asset that precedes a batch payment, with the
// planned payment as separate context.
message BatchPaymentApproval {
    //comment:approval is the chain-specific spending authorization transaction. Its selected body carries the
    // allowance, spender, fee settings and nonce when available.
    FungibleAssetApproval approval = 1;
    //comment:batch_context describes the planned batch payment. Its recipients and amounts are context and are not
    // transfers performed by the authorization transaction.
    BatchPaymentBody batch_context = 2;
}

//comment:BatchPaymentSend is the batch payment transaction.
message BatchPaymentSend {
    //comment:transaction is the chain body of the batch. gas_limit and nonce are not inside it.
    BatchPaymentBody transaction = 1;
    //symbol_value:"21000"
    //comment:gas_limit is the gas limit stored on the batch transaction. Same type and quantity as EVMGas.gas_limit.
    // Omitted when the batch transaction has none.
    google.protobuf.StringValue gas_limit = 2;
    //symbol_value:1
    //comment:nonce is the nonce stored on the batch transaction. Same type as EVMSendNative.nonce. Empty or non-numeric
    // stored nonces are omitted.
    google.protobuf.Int64Value nonce = 3;
}

//comment:FiatBeneficiary is a fiat recipient display summary. Beneficiary IDs, emails, birth dates,
// full account numbers and routing numbers are omitted for all tokens and signing callbacks.
message FiatBeneficiary {
    //symbol_value:"Ada Lovelace"
    //comment:name is the display name. An individual uses the first and last name, or the full name when those are
    // empty. A business uses the business name.
    string name = 2;
    //symbol_value:"individual"
    //comment:kind is individual or business. Any other stored type leaves this empty.
    string kind = 3;
    //comment:bank_account is a display-only bank account summary. Other payment methods are not returned.
    FiatBankAccount bank_account = 6;
}

//comment:FiatBankAccount is the same bank/payment summary for all tokens and signing callbacks.
// Full account and routing numbers are never exposed.
message FiatBankAccount {
    //symbol_value:"6789"
    //comment:account_last4 is the final four characters after removing spaces and hyphens.
    // Set only when the normalized account has more than four ASCII letters/digits and no other characters.
    // Otherwise empty; the full account is never returned as a fallback.
    string account_last4 = 1;
    //symbol_value:"checking"
    //comment:account_type is the stored account type.
    string account_type = 2;
    //symbol_value:"CHASUS33"
    //comment:bic is the stored BIC.
    string bic = 4;
    //symbol_value:"US"
    //comment:country_code is the stored bank country code.
    string country_code = 5;
    //symbol_value:"Example Bank"
    //comment:bank_name is the stored bank name.
    string bank_name = 6;
    //symbol_value:"WIRE"
    //comment:transfer_type is the stored transfer type.
    string transfer_type = 7;
}

//comment:FiatPayment is a token transfer that pays a fiat order.
message FiatPayment {
    //comment:transaction is the chain transfer that pays the order.
    ChainTransaction transaction = 1;
    //symbol_value:"USDC"
    //comment:source_currency is the source currency code stored on the fiat order.
    string source_currency = 2;
    //symbol_value:"10"
    //comment:source_amount is the gross decimal funding amount in whole source_currency units; "10" with "USDC" means
    // 10 USDC.
    // The nested transaction instead uses smallest units, such as "10000000". Empty means unavailable.
    string source_amount = 3;
    //symbol_value:"USD"
    //comment:target_currency is the target currency code stored on the fiat order.
    string target_currency = 4;
    //symbol_value:"10"
    //comment:target_amount is the decimal amount in whole target_currency units; "10" with "USD" means 10 US dollars.
    // Empty means unavailable.
    string target_amount = 5;
    //comment:beneficiary is the recipient display summary; sensitive data is omitted for all tokens and callbacks.
    // Missing or unparseable stored data leaves this unset without failing the read.
    FiatBeneficiary beneficiary = 6;
}

//comment:AptosRegisterCoin registers a coin on an Aptos account so that it can receive it.
message AptosRegisterCoin {
    //symbol_value:1
    //comment:chain_id follows the existing Aptos convention. Use 1 for Aptos Mainnet and 126 for Movement Mainnet.
    uint64 chain_id = 1;
    //symbol_value:"<string>"
    //comment:from is the account that registered the coin. Get returns the address stored on the request.
    string from = 2;
    //symbol_value:"0x1::aptos_coin::AptosCoin"
    //comment:coin_tag is the coin type being registered.
    string coin_tag = 3;
    //comment:gas_fee uses the same fields as AptosGas.
    AptosGas gas_fee = 4;
}

//comment:AptosOpenToken lets an Aptos account receive NFTs sent to it directly.
message AptosOpenToken {
    //symbol_value:1
    //comment:chain_id follows the existing Aptos convention. Use 1 for Aptos Mainnet and 126 for Movement Mainnet.
    uint64 chain_id = 1;
    //symbol_value:"<string>"
    //comment:from is the account that opened direct NFT transfer. Get returns the address stored on the request.
    string from = 2;
    //comment:gas_fee uses the same fields as AptosGas.
    AptosGas gas_fee = 3;
}

//comment:VaultCreation is the approval of a new vault.
message VaultCreation {
    //symbol_value:"Treasury"
    //comment:name is the name of the vault being created.
    string name = 1;
    //symbol_value:"[]"
    //comment:key_path is the derivation path stored for the vault.
    string key_path = 2;
}

//comment:VaultSettingUpdate is an empty marker for a setting change in SigningRequest.vault_uuid's vault.
// Setting details are not exposed.
message VaultSettingUpdate {}

//comment:RootKeyGeneration is the generation of an MPC root key (ECDSA or EdDSA).
message RootKeyGeneration {
    //symbol_value:"KEY_TYPE_ECC_SECP256K1"
    //comment:key_type is KEY_TYPE_ECC_SECP256K1 or KEY_TYPE_ECC_ED25519.
    KeyType key_type = 1;
    //symbol_value:"[]"
    //comment:key_path is the derivation path. An empty stored path is returned as [].
    string key_path = 2;
}

//comment:RootKeyBackup describes a backup of the organization's root keys. Only its public encryption metadata is
// returned; backup ciphertext is never returned by this API.
message RootKeyBackup {
    //comment:encryption_public_keys are three backup-share encryption recipient keys, not wallet root keys.
    // Each is "ssh-ed25519 <Base64 key>" in SSH authorized-key format, without a trailing comment.
    repeated string encryption_public_keys = 1;
}

//comment:KeyAccessGrant grants a member or an API client signer access to a key. SigningRequest.vault_uuid identifies
// the vault scope; an unset vault_uuid means an organization-level grant.
message KeyAccessGrant {
    //symbol_value:"<string>"
    //comment:user_uuid is the member or client signer receiving the key.
    string user_uuid = 2;
    //symbol_value:"[]"
    //comment:key_path is the derivation path. An empty stored path is returned as [] when a key type is set.
    string key_path = 3;
    //symbol_value:["KEY_TYPE_ECC_SECP256K1"]
    //comment:key_types are KEY_TYPE_ECC_SECP256K1, KEY_TYPE_ECC_ED25519, or both.
    repeated KeyType key_types = 4;
}

message StellarMessage {
    //symbol_value:"<string>"
    //comment:from is the account that signs the message.
    string from = 1;
    //symbol_value:"aGVsbG8="
    //comment:content is the raw bytes of the stored message string. It is not hex-decoded.
    bytes content = 2;
}

message StellarAuthEntry {
    //symbol_value:"<string>"
    //comment:from is the account that signs the authorization entry.
    string from = 1;
    //symbol_value:"QVFBLQ=="
    //comment:content preserves stored authorization text bytes without decoding or normalization.
    // Current plugin requests store Base64 Soroban HashIdPreimage XDR, not SorobanAuthorizationEntry bytes.
    // ProtoJSON adds a Base64 transport layer: decode it to recover the stored text, then decode the inner Base64
    // when applicable. Historical text may use another format.
    bytes content = 2;
}

message StellarChallenge {
    //symbol_value:"<string>"
    //comment:from is the account that signs the SEP-10 challenge.
    string from = 1;
    //symbol_value:"<string>"
    //comment:tx_base64 is the base64 encoded challenge transaction.
    string tx_base64 = 2;
}

//comment:AptosSignTransaction co-signs a whole transaction, unlike AptosSendCustom's transaction payload.
message AptosSignTransaction {
    //symbol_value:1
    //comment:chain_id follows the existing Aptos convention. Use 1 for Aptos Mainnet and 126 for Movement Mainnet.
    uint64 chain_id = 1;
    //symbol_value:"<string>"
    //comment:from is the account co-signing the transaction.
    string from = 2;
    //symbol_value:"AQID"
    //comment:transaction is the original transaction before any as_fee_payer override.
    // Stored 0x-prefixed hex is decoded to bytes; other text is returned as raw bytes.
    // Applying from as fee payer during signing does not rewrite this field.
    bytes transaction = 3;
    //comment:gas_fee uses the same fields as AptosGas.
    AptosGas gas_fee = 4;
    //symbol_value:true
    //comment:as_fee_payer applies from as fee payer during signing when true, authorizing this wallet to pay gas.
    // When false, the original transaction's fee-payer address is retained.
    bool as_fee_payer = 5;
}

//comment:RequestSource describes an inbound dApp's intake channel, not authenticated dApp or user identity.
message RequestSource {
    enum Type {
        TYPE_UNSPECIFIED = 0;
        TYPE_WALLET_CONNECT = 1;
        TYPE_PLUGIN = 2;
        TYPE_MMI = 3;
    }
    //comment:type is the intake channel set by MPCVault, not chosen by the dApp.
    // It does not verify the dApp or person; any vault member can create a plugin request.
    // Neither type nor website alone is sufficient to approve a request.
    Type type = 1;
    //symbol_value:"app.uniswap.org"
    //comment:website is the website the dApp claimed for itself. It is not verified: treat it as untrusted input.
    google.protobuf.StringValue website = 2;
}

message EVMInputDataDecode {
    message Argument {
        string name = 1;
        string type = 2;
        string data = 3;
    }
    //required:true
    //symbol_value:"function_name(arg1_type arg1_value, arg2_type arg2_value, ...)"
    //comment:function is the name of the function to be called.
    string function = 1;
    //required:true
    //symbol_value:[{"name":"arg1_name","type":"arg1_type","data":"arg1_value"},{"name":"arg2_name","type":"arg2_type","data":"arg2_value"}]
    //comment:args is the list of arguments to be passed to the function.
    repeated Argument args = 2;
}

message BatchPaymentRecipient {
    //required:true
    //symbol_value:"<string>"
    //comment:address is the address of the recipient.
    string address = 1;
    //required:true
    //symbol_value:"0.001"
    //comment:amount is the integer amount in the asset's smallest unit: wei for EVM native assets,
    // satoshi for Bitcoin, or whole-token amount multiplied by 10^decimals for tokens.
    string amount = 2;
    //symbol_value:"Monthly payroll"
    //comment:notes is a note for this entry in the batch payment.
    google.protobuf.StringValue notes = 3;
}

message EVMBatchSendNative {
    //required:true
    //symbol_value:137
    //comment:chain_id is the chain id of the transaction.
    uint64 chain_id = 1;
    //required:true
    //symbol_value:"<string>"
    //comment:from is the sender wallet address. It has to be in this vault.
    string from = 2;
    //required:true
    //symbol_value:[{"address":"<string>","amount":0.001,"notes":"Monthly payroll"}]
    //comment:recipients is the list of recipients.
    repeated BatchPaymentRecipient recipients = 3;
    //comment:batch_contract_address is the output-only execution contract, not a recipient.
    // ClientSigner verifies the prepared transaction target against it. Rejected by CreateBatchPayment;
    // it cannot select a contract.
    string batch_contract_address = 4;
}

message EVMBatchSendERC20 {
    //required:true
    //symbol_value:137
    //comment:chain_id is the chain id of the transaction.
    uint64 chain_id = 1;
    //required:true
    //symbol_value:"<string>"
    //comment:from is the sender wallet address. It has to be in this vault.
    string from = 2;
    //required:true
    //symbol_value:"<string>"
    //comment:token_contract_address is the address of the ERC20 token contract.
    string token_contract_address = 3;
    //recipients is the list of recipients.
    repeated BatchPaymentRecipient recipients = 4;
    //comment:batch_contract_address is the output-only execution contract, separate from token_contract_address.
    // ClientSigner verifies the prepared transaction target against it. Rejected by CreateBatchPayment;
    // it cannot select a contract.
    string batch_contract_address = 5;
}

message BTCBatchSendNative {
    //required:true
    //symbol_value:"<string>"
    //comment:from is the sender wallet address. It has to be in this vault.
    string from = 1;
    //recipients is the list of recipients.
    repeated BatchPaymentRecipient recipients = 2;
}

message SUIBatchSendNative {
    //required:true
    //symbol_value:"<string>"
    //comment:from is the sender wallet address. It has to be in this vault.
    string from = 1;
    //recipients is the list of recipients.
    repeated BatchPaymentRecipient recipients = 2;
}

message SUIBatchSendCoin {
    //required:true
    //symbol_value:"<string>"
    //comment:from is the sender wallet address. It has to be in this vault.
    string from = 1;
    //required:true
    //symbol_value:"tx_hash:0a1b2c3d...789e, output_index:0"
    //comment:coin_tag identifies the coin to be sent.
    string coin_tag = 2;
    repeated BatchPaymentRecipient recipients = 3;
}

message CreateBatchPaymentRequest {
    //symbol_value:"Monthly payroll"
    //comment:name is the name of the batch payment.
    string name = 1;
    //symbol_value:"Monthly payroll"
    //comment:notes is the transaction notes for the batch payment.
    google.protobuf.StringValue notes = 2;
    //type is the type of the batch payment. It is a oneof field.
    oneof type {
        EVMBatchSendNative evm_batch_send_native = 3;
        EVMBatchSendERC20 evm_batch_send_erc20 = 4;
        BTCBatchSendNative btc_batch_send_native = 5;
        SUIBatchSendNative sui_batch_send_native = 6;
        SUIBatchSendCoin sui_batch_send_coin = 7;
    }
}

message CreateBatchPaymentResponse {
    BatchPayment batch_payment = 1;
    Error error = 2;
}

message GetBatchPaymentDetailsRequest {
    //required:true
    //symbol_value:"<string>"
    //comment:uuid is the unique identifier of the batch payment.
    string uuid = 1;
}

message GetBatchPaymentDetailsResponse {
    BatchPayment batch_payment = 1;
    Error error = 2;
}

message BatchPayment {
    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_PENDING = 1;
        STATUS_SUCCEEDED = 2;
        STATUS_FAILED = 3;
    }
    //required:true
    //symbol_value:"<string>"
    //comment:uuid is the unique identifier of the batch payment.
    string uuid = 1;
    //symbol_value:"name1"
    //comment:name is the name of the batch payment.
    string name = 2;
    //symbol_value:"notes test"
    //comment:notes is the transaction notes for the batch payment.
    string notes = 3;
    //required:true
    //symbol_value:"0"
    //comment:status is the status of the batch payment.
    Status status = 4;
    //symbol_value:"failed reason"
    //comment:failed_reason is the reason why the batch payment failed, only set if status is STATUS_FAILED.
    string failed_reason = 5;
    //required:true
    //symbol_value:1744274467154
    //comment:creation_timestamp is the timestamp when the batch payment was created.
    uint64 creation_timestamp = 6;
    //approval_signing_request is the signing request that approves the tokens to be sent if needed.
    SigningRequest approval_signing_request = 7;
    //send_signing_request is the signing request that sends the batch payment.
    SigningRequest send_signing_request = 8;
    //type is the type of the batch payment. It is a oneof field.
    oneof type {
        EVMBatchSendNative evm_batch_send_native = 9;
        EVMBatchSendERC20 evm_batch_send_erc20 = 10;
        BTCBatchSendNative btc_batch_send_native = 11;
        SUIBatchSendNative sui_batch_send_native = 12;
        SUIBatchSendCoin sui_batch_send_coin = 13;
    }
}

message GetSigningRequestListRequest {
    enum SortOrder {
        SORT_ORDER_DESC = 0;
        SORT_ORDER_ASC = 1;
    }
    //required:true
    //symbol_value:"<string>"
    //comment:vault_uuid is the required UUID of one vault accessible to the API token in its organization.
    string vault_uuid = 1;
    //symbol_value:1
    //comment:page is the page number, starting at 1.
    //default: 1
    google.protobuf.Int64Value page = 2;
    //symbol_value:10
    //comment:limit is the number of signing requests to return.
    //default: 10
    //max: 100
    google.protobuf.Int64Value limit = 3;
     //required:true
    //symbol_value:"0"
    //comment:sort_order is descending (0, default) or ascending (1).
    SortOrder sort_order = 4;
}

message GetSigningRequestListResponse {
    repeated SigningRequest signing_requests = 1;
    Error error = 2;
}

message ResimulationRequest {
    //required:true
    //symbol_value:"<string>"
    //comment:signing_request_uuid is the UUID of the signing request to be simulated.
    string signing_request_uuid = 1;
}

message ResimulationResponse {
    //required:true
    //symbol_value:"<string>"
    //comment:simulation is the simulation of the signing request.
    bytes simulation = 1;
    Error error = 2;
}

message UpdateWalletRequest {
    //required:true
    //symbol_value:"<string>"
    //comment:address is the address of the wallet in the network.
    string address = 1;
    //symbol_value:"my wallet"
    //comment:name is the new name for the wallet. Empty means no change. min length is 1, max length is 85.
    string name = 2;
    //symbol_value:"STATUS_ACTIVE"
    //comment:status is the new wallet status: "STATUS_ACTIVE" or "STATUS_ARCHIVED"; other values are rejected. Empty
    // means no change. Set name, status or both.
    string status = 3;
}

message UpdateWalletResponse {
    Wallet details = 1;
    Error error = 2;
}

//comment:RejectSigningRequestsRequest selects ongoing wallet and vault-management requests using existing rejection
// rules.
// Requires a full access token. Requests without a vault and ClientSigner key grants are excluded.
message RejectSigningRequestsRequest {
    //symbol_value:"<string>"
    //comment:vault_uuid selects one accessible vault in the API token's organization.
    // Empty scans all vaults the token can access in that organization.
    string vault_uuid = 1;
}

message RejectSigningRequestsResponse {
    //comment:error reports a request-level failure or a failure count, without per-request details.
    // Processing continues after individual failures; successful rejections are not rolled back.
    // Unset when all selected requests are rejected or none match.
    Error error = 1;
}

//comment:ApproveSigningRequestRequest records approval without signing or requiring a ClientSigner.
// Available to full access and read-only API users, subject to authentication, subscription, organization/vault scope
// and approval policy.
message ApproveSigningRequestRequest {
    //required:true
    //comment:uuid identifies a pending transaction or message signing request to approve as the authenticated API user.
    // Unsupported request types and approval policies are rejected.
    string uuid = 1;
}

message ApproveSigningRequestResponse {
    //comment:error is unset when approval succeeds, even if other approvals are still needed.
    // Supported requests that already succeeded return success without adding another approval.
    Error error = 1;
}

//comment:SigningRequestOperation is one current API workflow action. It is output-only and does not grant permission to
// execute it.
message SigningRequestOperation {
    oneof body {
        //comment:approve means the authenticated API user can contribute an approval still needed by the current
        // policy.
        ApproveOperation approve = 1;
        //comment:sign means prerequisite approvals are satisfied for eligible ClientSigner targets.
        // A ClientSigner's own approval performed with signing is included; a missing API-user approval is not.
        SignOperation sign = 2;
    }
}

message ApproveOperation {}

message SignOperation {
    //comment:client_signer_public_keys are distinct eligible SSH keys for this request's API signing path,
    // not all organization signers. Keys are alternative targets, not cumulative requirements.
    // Always nonempty; the current binding supports at most one target.
    repeated string client_signer_public_keys = 1;
}

//comment:GetPendingSigningRequestsRequest only queries workflow actions; it does not prepare, approve, sign or reject.
// A returned sign operation does not grant ExecuteSigningRequests permission.
message GetPendingSigningRequestsRequest {
    //comment:vault_uuid selects one accessible vault in the API token's organization, or all accessible vaults when
    // empty.
    // Requests without a vault are excluded.
    string vault_uuid = 1;
}

message GetPendingSigningRequestsResponse {
    //comment:signing_requests contains all ongoing requests with a pending_operation; no pagination or truncation.
    // Uses the same payload and field visibility as GetSigningRequestList.
    // Evaluation failures or the response-size limit return an RPC error instead of partial results.
    repeated SigningRequest signing_requests = 1;
    Error error = 2;
}
