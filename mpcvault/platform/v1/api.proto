enum StellarMemoType {
    //comment:STELLAR_MEMO_TYPE_UNSPECIFIED preserves legacy creation behavior: an empty memo means no memo and a nonempty
    // memo means TEXT.
    STELLAR_MEMO_TYPE_UNSPECIFIED = 0;
    //comment:STELLAR_MEMO_TYPE_TEXT is UTF-8 text of at most 28 bytes, not 28 characters. An empty value retains the
    // existing no-memo meaning.
    STELLAR_MEMO_TYPE_TEXT = 1;
    //comment:STELLAR_MEMO_TYPE_ID is an unsigned 64-bit integer represented by decimal digits. "0" is a valid ID memo;
    // an empty string means no memo.
    STELLAR_MEMO_TYPE_ID = 2;
    //comment:STELLAR_MEMO_TYPE_HASH is a 32-byte hash represented by exactly 64 hexadecimal characters without a 0x
    // prefix. An empty string means no memo.
    STELLAR_MEMO_TYPE_HASH = 3;
    //comment:STELLAR_MEMO_TYPE_RETURN is a 32-byte return hash represented by exactly 64 hexadecimal characters without
    // a 0x prefix. An empty string means no memo.
    STELLAR_MEMO_TYPE_RETURN = 4;
}

