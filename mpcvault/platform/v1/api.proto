syntax = "proto3";

package mpcvault.platform.v1;

import "google/protobuf/wrappers.proto";
import "google/api/annotations.proto";
import "mpcvault/platform/v1/error.proto";

option go_package = "go.mpcvault.com/genproto/mpcvaultapis/platform/v1;platform";
option java_multiple_files = true;
option java_outer_classname = "PlatformProto";
option java_package = "com.mpcvault.platform.v1";


service PlatformAPI {
    // CreateSigningRequest creates a signing request. The signing request can be completed using the MPCVault mobile app or using the API client signer.
    rpc CreateSigningRequest (CreateSigningRequestRequest) returns (CreateSigningRequestResponse){
        option (google.api.http) = {
            post: "/v1/createSigningRequest"
            body: "*"
        };
    };

    // RejectSigningRequest rejects a signing request. Once a signing request is rejected, it cannot be re-opened.
    rpc RejectSigningRequest (RejectSigningRequestRequest) returns (RejectSigningRequestResponse){
        option (google.api.http) = {
            post: "/v1/rejectSigningRequest"
            body: "*"
        };
    };

    //comment:RejectSigningRequests rejects ongoing wallet and vault-management requests in accessible vaults.
    rpc RejectSigningRequests (RejectSigningRequestsRequest) returns (RejectSigningRequestsResponse){
        option (google.api.http) = {
            post: "/v1/rejectSigningRequests"
            body: "*"
        };
    };

    // ApproveSigningRequest records the authenticated API user's approval without signing.
    rpc ApproveSigningRequest (ApproveSigningRequestRequest) returns (ApproveSigningRequestResponse){
        option (google.api.http) = {
            post: "/v1/approveSigningRequest"
            body: "*"
        };
    };

    //comment:GetSigningRequestDetails returns the status, payload and available signing results of a signing request.
    rpc GetSigningRequestDetails (GetSigningRequestDetailsRequest) returns (GetSigningRequestDetailsResponse){
        option (google.api.http) = {
            post: "/v1/getSigningRequestDetails"
            body: "*"
        };
    };

    // CreateBatchPayment creates a batch payment. Complete its wallet signing requests using the MPCVault web app or ExecuteSigningRequests with a configured API client signer.
    rpc CreateBatchPayment (CreateBatchPaymentRequest) returns (CreateBatchPaymentResponse){
        option (google.api.http) = {
            post: "/v1/createBatchPayment"
            body: "*"
        };
    };

    // GetBatchPaymentDetails returns a batch payment and its signing requests.
    rpc GetBatchPaymentDetails (GetBatchPaymentDetailsRequest) returns (GetBatchPaymentDetailsResponse){
        option (google.api.http) = {
            post: "/v1/getBatchPaymentDetails"
            body: "*"
        };
    };

    // CreateWallet creates a wallet. Wallets created will be EOA wallets. You are responsible for completing a sanity tests before using the wallet.
    // While the response contains the public key, you are strongly discouraged from using it to generate the wallet address yourself. Instead, use the address returned in the response.
    rpc CreateWallet (CreateWalletRequest) returns (CreateWalletResponse){
        option (google.api.http) = {
            post: "/v1/createWallet"
            body: "*"
        };
    };

    //comment:ExecuteSigningRequests signs a supported wallet request using the configured API ClientSigner.
    rpc ExecuteSigningRequests (ExecuteSigningRequestsRequest) returns (ExecuteSigningRequestsResponse){
        option (google.api.http) = {
            post: "/v1/executeSigningRequests"
            body: "*"
        };
    };

    // GetBalance returns the details of a asset balance.
    rpc GetBalance (GetBalanceRequest) returns (GetBalanceResponse){
        option (google.api.http) = {
            post: "/v1/getBalance"
            body: "*"
        };
    };

    // GetWalletInfo returns the details of a wallet.
    rpc GetWalletInfo (GetWalletInfoRequest) returns (GetWalletInfoResponse){
        option (google.api.http) = {
            post: "/v1/getWalletInfo"
            body: "*"
        };
    };

    // GetWalletList returns the wallets details.
    rpc GetWalletList (GetWalletListRequest) returns (GetWalletListResponse){
        option (google.api.http) = {
            post: "/v1/getWalletList"
            body: "*"
        };
    };

    //comment:GetSigningRequestList returns a page of signing requests in one vault.
    rpc GetSigningRequestList (GetSigningRequestListRequest) returns (GetSigningRequestListResponse){
        option (google.api.http) = {
            post: "/v1/getSigningRequestList"
            body: "*"
        };
    };

    //comment:GetPendingSigningRequests returns all requests awaiting the API user's approval or ready for their bound
    // ClientSigner.
    rpc GetPendingSigningRequests (GetPendingSigningRequestsRequest) returns (GetPendingSigningRequestsResponse){
        option (google.api.http) = {
            post: "/v1/getPendingSigningRequests"
            body: "*"
        };
    };

    // Resimulation returns the transaction simulation.
    rpc Resimulation (ResimulationRequest) returns (ResimulationResponse){
        option (google.api.http) = {
            post: "/v1/resimulation"
            body: "*"
        };
    };

    // UpdateWallet updates a wallet's attributes. The wallet is located by its address.
    // name and status can be updated together.
    rpc UpdateWallet (UpdateWalletRequest) returns (UpdateWalletResponse){
        option (google.api.http) = {
            post: "/v1/updateWallet"
            body: "*"
        };
    };
}

message GetWalletInfoRequest {
    oneof type {
        //comment:address is the address of the wallet in the network.
        string address = 100;
        //comment:ref is unique identifier for the wallet as configured by the user.
        string ref = 101;
    }
}

message GetWalletInfoResponse {
    Wallet details = 1;
    Error error = 2;
}

message GetWalletListRequest {
    //required:true
    //symbol_value:"<string>"
    //default:null
    //comment:vault_uuid is the UUID of the vault that the wallet was created in.
    string vault_uuid = 1;
    //symbol_value:"1"
    //default: 1
    //comment:page is the page number.
    google.protobuf.Int64Value page = 2;
    //symbol_value:"100"
    //default:100
    //max:100
    //comment:limit is the number of wallets to return.
    google.protobuf.Int64Value limit = 3;
}

message GetWalletListResponse {
    //symbol_value:[{"address":"<string>","name":"test wallet","status":"STATUS_ACTIVE"}]
    //comment:details_list is the list of wallets.
    repeated Wallet details_list = 1;
    Error error = 2;
}

message GetBalanceRequest {
    //required:true
    //symbol_value:"1"
    //default:null
    //comment:network_type is the type of the network.
    NetworkType network_type = 1;
    //symbol_value:"137"
    //default:null
    //comment chain_id is the chain id of the network.
    google.protobuf.Int64Value chain_id = 2;
    //required:true
    //symbol_value:"<string>"
    //default:null
    //comment:wallet_address this is the wallet address.
    string wallet_address = 3;
    //symbol_value:"<string>"
    //default:null
    //comment:token_address this is the token address,if not set, it will return the balance of the native token.
    google.protobuf.StringValue token_address = 4;
}

message GetBalanceResponse {
    //symbol_value:0.12128
    //comment:balance is the decimal balance in whole asset units: "1" means 1 ETH, not 1 wei; "10.5" means 10.5 tokens.
    string balance = 1;
    //comment:The error is null when success.
    Error error = 2;
}

message CreateWalletRequest {
    //required:true
    //symbol_value:"<string>"
    //comment:vault_uuid is the UUID of the vault that the wallet will be created in.You can find it in the settings
    // page of your vault on the web.
    string vault_uuid = 1;
    //symbol_value:"<string>"
    //comment:callback_client_signer_public_key is the public key of the api client signer. It is used to identify the
    // where we should send the callback to.
    string callback_client_signer_public_key = 2;
    //required:true
    //symbol_value:"1"
    //comment:network_type is the type of the network.
    NetworkType network_type = 3;
    //symbol_value:"customer-wallet-001"
    //comment:ref is the customer reference field for the wallet. It has to be unique if not empty.max length is 500
    // characters.
    string ref = 4;
    //symbol_value:"test wallet"
    //comment:name is the name for the wallet.  max length is 85 characters.
    string name = 5;
}
enum NetworkType {
    NETWORK_TYPE_UNKNOWN = 0;
    NETWORK_TYPE_EVM = 1;
    NETWORK_TYPE_BITCOIN = 2;
    NETWORK_TYPE_TRON = 3;
    NETWORK_TYPE_APTOS = 4;
    NETWORK_TYPE_SUI = 5;
    NETWORK_TYPE_SOLANA = 6;
    NETWORK_TYPE_TON = 7;
    NETWORK_TYPE_STELLAR = 8;
}
enum KeyType {
    KEY_TYPE_UNSPECIFIED = 0;
    KEY_TYPE_ECC_SECP256K1 = 1;
    KEY_TYPE_ECC_ED25519 = 2;
}
message Wallet {
    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_PENDING = 1;
        STATUS_ACTIVE = 2;
        STATUS_ARCHIVED = 3;
    }
    //symbol_value:"<string>"
    //comment:vault_uuid is the UUID of the vault that the wallet was created in.
    string vault_uuid = 1;
    //symbol_value:"1"
    //comment:key_type is the type of the key.
    KeyType key_type = 2;
    //symbol_value:"path/to/key"
    //comment:key_path is the path of the key.
    string key_path = 3;
    //symbol_value:"<string>"
    //comment:public_key is the public key of the key.
    bytes public_key = 4;
    //symbol_value:"1"
    //comment:network_type is the type of the network.
    NetworkType network_type = 5;
    //symbol_value:"<string>"
    //comment:address is the address of the wallet in the network.
    string address = 6;
    //symbol_value:"customer-wallet-001"
    //comment:ref is unique identifier for the wallet as configured by the user.
    string ref = 7;
    //symbol_value:"1"
    //comment:status is the status of the wallet.
    Status status = 8;
    //symbol_value:"test wallet "
    //comment:name is the name for the wallet.
    string name = 9;
}
message CreateWalletResponse {
    Wallet details = 1;
    Error error = 2;
}

//comment:ExecuteSigningRequestsRequest requires a full access token with access to the request and a configured, online
// API ClientSigner. Only supported wallet requests can be executed; queryable management requests cannot.
message ExecuteSigningRequestsRequest {
    //required:true
    //symbol_value:"<string>"
    //comment:uuid is the UUID of one wallet signing request to execute, whether created through the API, MPCVault app
    // or a connected dApp.
    string uuid = 1;
}
message ExecuteSigningRequestsResponse {
    Error error = 1;
    //symbol_value:"<string>"
    //comment:tx_hash is the signed transaction hash, when available. It does not confirm successful broadcasting or
    // on-chain execution. Message requests may have no transaction hash.
    string tx_hash = 2;
    //comment:signatures contains complete signature results in signing order, when available. See SignatureContainer;
    // these are not MPC signature shares.
    SignatureContainer signatures = 3;
    //comment:signed_transaction is the serialized signed transaction, when available, using the encoding on
    // SigningRequest.signed_transaction. Absent for messages; co-signed transactions may still need other parties'
    // signatures.
    string signed_transaction = 4;
}

//comment:SignatureContainer contains complete signatures of messages or digests in signing order, not MPC shares. A
// Bitcoin transaction may have one result per input digest.
message SignatureContainer {
    message SignResponse {
        oneof signature {
            ECDSASignature ecdsa_signature = 1;
            //symbol_value:"<string>"
            //comment:eddsa_signature is the 64-byte Ed25519 signature of the raw message, R_bytes || s_bytes, available
            // only for STATUS_SUCCEEDED. R_bytes uses the canonical 32-byte encoding in RFC 8032, Section 5.1.2.
            bytes eddsa_signature = 2;
        }
    }
    message ECDSASignature {
        string R = 1;
        string S = 2;
        string V = 3;
    }
    repeated SignResponse signatures = 1;
}

message EVMMessage {
    enum Type {
        TYPE_UNSPECIFIED = 0;
        TYPE_PERSONAL_SIGN = 1;
        TYPE_SIGN_TYPED_DATA = 2;
        //comment:TYPE_ETH_SIGN identifies eth_sign on existing dApp requests. Output-only; rejected by
        // CreateSigningRequest.
        TYPE_ETH_SIGN = 3;
    }
    //symbol_value:"137"
    //comment:chain_id is the chain id of the network.
    uint64 chain_id = 1;
    //symbol_value:"<string>"
    //comment:from is the address of the sender. It has to be in this vault.
    string from = 2;
    //required:true
    //symbol_value:"0"
    //comment:type is the type of the message.
    Type type = 3;
    //symbol_value:"<string>"
    //comment:content contains hex-decoded message bytes for TYPE_PERSONAL_SIGN and TYPE_ETH_SIGN,
    // or typed-data text bytes for TYPE_SIGN_TYPED_DATA. TYPE_ETH_SIGN has no personal_sign prefix.
    bytes content = 4;
}

message AptosMessage {
    enum Type {
        TYPE_UNSPECIFIED = 0;
        TYPE_DEFAULT = 1;
    }
    message Message {
        //symbol_value:"<string>"
        //comment:address is the address of the sender. It has to be in this vault.
        google.protobuf.StringValue address = 1;
        //symbol_value:"application"
        //comment:application is the application of the message.
        google.protobuf.StringValue application = 2;
        //symbol_value:1
        //comment:chain_id is the optional chain ID in the signed content, separate from AptosMessage.network.
        // When absent, it is not filled from network.
        google.protobuf.Int64Value chain_id = 3;
        //symbol_value:"message"
        //comment:message is the message of the message.
        string message = 4;
        //symbol_value:"1"
        //comment:nonce is the nonce of the message.
        string nonce = 5;
    }
    //symbol_value:"<string>"
    //comment:from is the sender wallet address. It has to be in this vault.
    string from = 1;
    //required:true
    //symbol_value:"0"
    //comment:type is the type of the message.
    Type type = 2;
    Message content = 3;
    //comment:network is output-only request context using the aptos body, including for Movement.
    // Omitted when the historical network is uncertain. It neither changes signed content nor provides replay protection.
    // CreateSigningRequest rejects this field; it cannot select a network.
    NetworkInfo network = 4;
}

message SolanaMessage {
    enum Type {
        TYPE_UNSPECIFIED = 0;
        TYPE_DEFAULT = 1;
    }
    //symbol_value:"<string>"
    //comment:from is the sender wallet address. It has to be in this vault.
    string from = 1;
    //required:true
    //symbol_value:"0"
    //comment:type is the type of the message.
    Type type = 2;
    //symbol_value:"<string>"
    //comment:content is the content of the message.
    bytes content = 3;
    //comment:network is output-only request context using the solana body; genesis_hash distinguishes Solana and Sonic
    // SVM.
    // Omitted when the historical network is uncertain. It neither changes signed content nor provides replay protection.
    // CreateSigningRequest rejects this field; it cannot select a network.
    NetworkInfo network = 4;
}

message SuiMessage {
    enum Type {
        TYPE_UNSPECIFIED = 0;
        TYPE_DEFAULT = 1;
    }
    //symbol_value:"<string>"
    //comment:from is the sender wallet address. It has to be in this vault.
    string from = 1;
    //required:true
    //symbol_value:"0"
    //comment:type is the type of the message.
    Type type = 2;
    //symbol_value:"<string>"
    //comment:content is the content of the message.
    bytes content = 3;
}

message TonMessage {
    enum Type {
        TYPE_UNSPECIFIED = 0;
        TYPE_DEFAULT = 1;
    }
    //symbol_value:"<string>"
    //comment:from is the sender wallet address. It has to be in this vault.
    string from = 1;
     //required:true
    //symbol_value:"0"
    //comment:type is the type of the message.
    Type type = 2;
    //symbol_value:"<string>"
    //comment:content is the content of the message.
    bytes content = 3;
}

message RawMessage {
    //symbol_value:"<string>"
    //comment:from is the wallet address of the key pair that we uses to sign the message. The wallet has to be in this
    // vault.We will use the key's algorithm to sign the message.
    string from = 1;
    //symbol_value:"<string>"
    //comment:content is the raw message content in bytes.
    bytes content = 2;
    //ecdsa_hash_function is the hash function to use for signing the message. Required if the key is ECDSA.This field will be ignored if the key is not ECDSA.
    ECDSAHashFunction ecdsa_hash_function = 3;
}

enum ECDSAHashFunction {
    ECDSA_HASH_FUNCTION_UNSPECIFIED = 0;
    ECDSA_HASH_FUNCTION_USE_MESSAGE_DIRECTLY = 1;
    ECDSA_HASH_FUNCTION_SHA256 = 2;
}

// EVMGas is the gas fee settings for an EVM transaction.
message EVMGas {
    //symbol_value:"30000000000"
    //comment:max_fee is the price cap in wei per gas, as a non-negative decimal integer string:
    // gasPrice for legacy transactions or maxFeePerGas for EIP-1559. Required on custom EVM networks;
    // otherwise omission lets the service select gas prices.
    google.protobuf.StringValue max_fee = 1;
    //symbol_value:"1500000000"
    //comment:max_priority_fee is the EIP-1559 tip cap in wei per gas, as a non-negative decimal integer string.
    // Applied only with max_fee on networks supporting priority fees; otherwise ignored.
    // A positive value must be less than max_fee. When omitted with max_fee, defaults to 30000000000 on Polygon
    // and 0 elsewhere. The network configuration determines the transaction type, even when this is omitted.
    google.protobuf.StringValue max_priority_fee = 2;
    //symbol_value:"21000"
    //comment:gas_limit is the maximum gas-unit count, as a positive decimal integer string within uint64 range.
    // Omission with max_fee uses a network- and request-specific default. Supplying only gas_limit leaves gas pricing
    // to the service.
    google.protobuf.StringValue gas_limit = 3;
}

message EVMSendNative {
    //symbol_value:137
    //comment:chain_id is the chain id of the network.
    uint64 chain_id = 1;
    //symbol_value:"<string>"
    //comment:from is the sender wallet address. It has to be in this vault.
    string from = 2;
    //symbol_value:"<string>"
    //comment:to is the address of the recipient.
    string to = 3;
    //symbol_value:"1000000000000000"
    //comment:value is the amount of the native token to send, denominated in wei.
    string value = 4;
    //when chain_id is a custom chain, this field is required.
    EVMGas gas_fee = 5;
    //symbol_value:1
    //comment:nonce is the nonce of the transaction. If this field is not set, we will use the next nonce of the
    // sender.when chain_id is a custom chain, this field is required.
    google.protobuf.Int64Value nonce = 6;
}

message EVMSendERC20 {
    //symbol_value:137
    //comment:chain_id is the chain id of the network.
    uint64 chain_id = 1;
    //symbol_value:"<string>"
    //comment:from is the sender wallet address. It has to be in this vault.
    string from = 2;
    //symbol_value:"<string>"
    //comment:to is the address of the recipient.
    string to = 3;
    //symbol_value:"<string>"
    //comment:token_contract_address is the address of the ERC20 token contract.
    string token_contract_address = 4;
    //symbol_value:"1000000000000000"
    //comment:amount is the amount of tokens to send. You should use whole integer representation. [amount *
    // 10^decimals],We will use the contract's decimals to convert the amount.
    string amount = 5;
    //when chain_id is a custom chain, this field is required.
    EVMGas gas_fee = 6;
    //symbol_value:1
    //comment:nonce is the nonce of the transaction. If this field is not set, we will use the next nonce of the
    // sender.when chain_id is a custom chain, this field is required.
    google.protobuf.Int64Value nonce = 7;
}

message EVMSendCustom {
    //symbol_value:"1"
    //comment:chain_id is the chain id of the network.
