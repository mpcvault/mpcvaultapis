//comment:SigningRequest uses the same payload for API, MPCVault app and dApp requests across read endpoints.
// The selected type identifies the payload; field comments specify visibility and execution restrictions.
message SigningRequest {
    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_PENDING = 1;
        STATUS_SUCCEEDED = 2;
        STATUS_FAILED = 3;
    }
    //required:true
    //symbol_value:"<string>"
    //comment:uuid is the unique identifier of the signing request.
    string uuid = 1;
    //required:true
    //symbol_value:"0"
    //comment:status is the operation status. STATUS_SUCCEEDED means signing completed for transactions and messages,
    // without confirming broadcast or on-chain execution. Management requests may succeed without signatures or transactions.
    Status status = 2;
    //symbol_value:"failed reason"
    //comment:failed_reason is the reason why the signing request failed, only set if status is STATUS_FAILED.
    string failed_reason = 3;
    //symbol_value:"<string>"
    //comment:tx_hash is the transaction hash available after signing, without confirming broadcast or on-chain
    // execution.
    // Message and management requests may have none.
    string tx_hash = 4;
    //symbol_value:1744274467154
    //comment:creation_timestamp is the timestamp when the signing request was created.
    uint64 creation_timestamp = 5;
    //type is the type of the signing request. It is a oneof field.
    oneof type {
        EVMSendNative evm_send_native = 6;
        EVMSendERC20 evm_send_erc20 = 7;
        //comment:evm_send_custom is a custom EVM transaction, including mapped dApp transactions.
        EVMSendCustom evm_send_custom = 8;
        BTCSendNative btc_send_native = 9;
        TronSendNative tron_send_native = 10;
        TronSendTRC10 tron_send_trc10 = 11;
        TronSendTRC20 tron_send_trc20 = 12;
        AptosSendNative aptos_send_native = 13;
        AptosSendCoin aptos_send_coin = 14;
        //comment:aptos_send_custom is an Aptos transaction payload, including dApp transactions other than
        // SIGN_TRANSACTION.
        AptosSendCustom aptos_send_custom = 15;
        SuiSendNative sui_send_native = 16;
        SuiSendCoin sui_send_coin = 17;
        //comment:sui_send_custom is a custom Sui transaction, including mapped dApp transactions.
        SuiSendCustom sui_send_custom = 18;
        SolanaSendNative solana_send_native = 19;
        SolanaSendSPLToken solana_send_spl_token = 20;
        CreateWalletRequest create_wallet = 21;
        //comment:evm_message includes dApp personal_sign, typed-data and eth_sign messages; type identifies the method.
        EVMMessage evm_message = 22;
        AptosMessage aptos_message = 23;
        SolanaMessage solana_message = 24;
        RawMessage raw_message = 25;
        SuiMessage sui_message = 26;
        TonSendNative ton_send_native = 27;
        TonSendToken ton_send_token = 28;
        //comment:ton_send_custom is a custom TON transaction, including mapped dApp transactions.
        TonSendCustom ton_send_custom = 29;
        TonMessage ton_message = 30;
        //comment:solana_send_custom is a custom Solana transaction, including mapped dApp transactions.
        SolanaSendCustom solana_send_custom = 31;
        SolanaSendNative sonic_svm_send_native = 32;
        SolanaSendSPLToken sonic_svm_send_spl_token = 33;
        SolanaSendCustom sonic_svm_send_custom = 34;
        StellarSendNative stellar_send_native = 35;
        StellarSendAsset stellar_send_asset = 36;
        //comment:stellar_send_custom is a Stellar transaction, including dApp transactions other than challenges
