    //symbol_value:"<string>"
    //comment:from is the sender wallet address. It has to be in this vault.
    string from = 2;
    //symbol_value:"<string>"
    //comment:to is the address of the recipient.
    string to = 3;
    //symbol_value:"1000000000000000"
    //comment:value is the amount of the native token to send, denominated in wei.
    string value = 4;
    //symbol_value:"<string>"
    //comment:input is the input data of the transaction.
    bytes input = 5;
    //when chain_id is a custom chain, this field is required.
    EVMGas gas_fee = 6;
    //symbol_value:1
    //comment:nonce is the nonce of the transaction. If this field is not set, we will use the next nonce of the
    // sender.when chain_id is a custom chain, this field is required.
    google.protobuf.Int64Value nonce = 7;
}

message BTCSendNative {
    //symbol_value:"<string>"
